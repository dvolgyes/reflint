[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[project]
name = "reflint"
version = "0.1.0"
description = "Comprehensive BibTeX Reference Checker and Fixer"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "bibtexparser>=1.4.4",
    "click>=8.4.1",
    "colorama>=0.4.6",
    "httpx2>=2.3.0,<3",
    "loguru>=0.7.3",
    "pygments~=2.20,<3",
    "rich>=15.0.0,<16",
    "ruamel-yaml>=0.19.1,<0.20",
]

[project.scripts]
reflint = "reflint.main:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
norecursedirs = ["tests/manual"]
