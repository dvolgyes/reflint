image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

stages:
  - test

variables:
  UV_CACHE_DIR: .uv-cache

cache:
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache/

tests:
  stage: test
  before_script:
    - uv sync --locked --dev
  script:
    - uv run pytest -n 8 --cov --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 week
  after_script:
    - uv cache prune --ci
